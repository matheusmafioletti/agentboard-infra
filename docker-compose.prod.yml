services:
  postgres:
    image: postgres:16
    env_file: .env.prod
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  agentboard-auth:
    image: ${GHCR_REGISTRY}/agentboard-auth:${AUTH_IMAGE_TAG:-latest}
    env_file: .env.prod
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      INVITE_BASE_URL: ${INVITE_BASE_URL}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  agentboard-board:
    image: ${GHCR_REGISTRY}/agentboard-board:${BOARD_IMAGE_TAG:-latest}
    env_file: .env.prod
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      WEBSOCKET_ALLOWED_ORIGINS: ${WEBSOCKET_ALLOWED_ORIGINS}
    depends_on:
      postgres:
        condition: service_healthy
      agentboard-auth:
        condition: service_started
    restart: unless-stopped

  agentboard-api-docs:
    image: ${GHCR_REGISTRY}/agentboard-api-docs:${API_DOCS_IMAGE_TAG:-latest}
    environment:
      AUTH_SERVICE_OPENAPI_URL: http://agentboard-auth:8080/v3/api-docs
      BOARD_SERVICE_OPENAPI_URL: http://agentboard-board:8081/v3/api-docs
    depends_on:
      - agentboard-auth
      - agentboard-board
    restart: unless-stopped

  agentboard-web:
    image: ${GHCR_REGISTRY}/agentboard-web:${WEB_IMAGE_TAG:-latest}
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - agentboard-web
      - agentboard-auth
      - agentboard-board
      - agentboard-api-docs
    restart: unless-stopped

volumes:
  pgdata:
